<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Quote video</title>
<style>
  @font-face {
    font-family: "Manrope";
    src: url("../src/assets/fonts/Manrope-VariableFont_wght.ttf") format("truetype");
    font-weight: 200 800;
  }
  :root {
    --navy: #052e3e;
    --cyan: #3fd4f0;
    /* unidad que escala igual en 16:9, 4:3 y vertical */
    --u: min(1vw, 1.7778vh);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: var(--navy);
    font-family: "Manrope", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: fixed; inset: 0; overflow: hidden; }

  /* Estrellas: puntos chicos y tenues, el resto del fondo queda #052E3E puro. */
  .stars { position: absolute; inset: -10% 0; }
  .star { position: absolute; border-radius: 50%; background: #bfefff; }

  .orbit { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .orbit ellipse {
    fill: none;
    stroke: rgba(63, 212, 240, 0.28);
    stroke-width: 1.5;
    stroke-linecap: round;
  }

  /* Solo el planeta del logo (recorte de la imagen con nombre). */
  .planet {
    position: absolute; left: 0; top: 0;
    width: calc(var(--u) * 5.6);
    aspect-ratio: 250 / 157;
    overflow: hidden;
    filter: drop-shadow(0 0 calc(var(--u) * 1.2) rgba(14, 165, 233, 0.55));
  }
  .planet img { display: block; height: 100%; width: auto; }

  .quote {
    position: absolute; left: 50%; top: 50%;
    width: calc(var(--u) * 62);
    text-align: center;
    color: #fff;
    font-weight: 600;
    font-size: calc(var(--u) * 3.9);
    line-height: 1.16;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .quote .w { display: inline-block; }
  /* Subrayado como fondo: sigue al texto aunque la frase ocupe dos líneas. */
  .quote em {
    font-style: normal;
    background: linear-gradient(var(--cyan), var(--cyan)) left bottom / 0% 0.06em no-repeat;
    padding-bottom: 0.06em;
  }

  @media (orientation: portrait) {
    .quote { width: calc(var(--u) * 78); font-size: calc(var(--u) * 7.6); line-height: 1.2; }
    .planet { width: calc(var(--u) * 11); }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stars"></div>
  <svg class="orbit"><ellipse /></svg>

  <p class="quote">
    Somos una empresa de desarrollo con más de dos años de experiencia.
    Hablamos <em>tu mismo idioma</em> y nos enfocamos en una sola cosa: que tu
    inversión digital traiga <em>resultados reales.</em>
  </p>

  <div class="planet"><img src="../src/assets/Yzen-Logo-With-Name-Color.png" alt="" /></div>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script>
  // Timeline de 1 s = todo el recorrido de la sección (sin paradas).
  const W = innerWidth, H = innerHeight;
  const u = Math.min(W / 100, (H * 1.7778) / 100);
  const portrait = H > W;
  const q = (s) => document.querySelector(s);
  const quote = q(".quote"), planet = q(".planet"), ellipse = q(".orbit ellipse");

  // Envuelve cada palabra en .w (respeta los <em>).
  function splitWords(el) {
    for (const node of [...el.childNodes]) {
      if (node.nodeType === 3) {
        const frag = document.createDocumentFragment();
        node.textContent.split(/(\s+)/).forEach((part) => {
          if (!part) return;
          if (/^\s+$/.test(part)) return frag.append(" ");
          const w = document.createElement("span");
          w.className = "w";
          w.textContent = part;
          frag.append(w);
        });
        node.replaceWith(frag);
      } else if (node.nodeType === 1) {
        splitWords(node);
      }
    }
    return [...el.querySelectorAll(".w")];
  }
  const words = splitWords(quote);
  const ems = [...quote.querySelectorAll("em")];

  // Estrellas con la misma semilla que el hero para que la transición sea continua.
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const starLayer = q(".stars");
  const stars = [];
  for (let i = 0; i < 70; i++) {
    const s = document.createElement("span");
    s.className = "star";
    const size = (0.08 + rand() * 0.16) * u;
    Object.assign(s.style, {
      left: `${rand() * 100}%`, top: `${rand() * 100}%`,
      width: `${size}px`, height: `${size}px`,
      opacity: (0.15 + rand() * 0.45).toFixed(2),
    });
    s.dataset.depth = (0.4 + rand() * 1.6).toFixed(2);
    starLayer.append(s);
    stars.push(s);
  }

  gsap.set(quote, { xPercent: -50, yPercent: -50 });

  // Órbita alrededor de la frase, inclinada, que se dibuja con el scroll.
  const box = quote.getBoundingClientRect();
  const cx = W / 2, cy = H / 2;
  const rx = box.width / 2 + (portrait ? 9 : 13) * u;
  const ry = box.height / 2 + (portrait ? 10 : 8) * u;
  const tilt = portrait ? -6 : -7;
  Object.entries({ cx, cy, rx, ry, transform: `rotate(${tilt} ${cx} ${cy})` })
    .forEach(([k, v]) => ellipse.setAttribute(k, v));
  const len = ellipse.getTotalLength();
  gsap.set(ellipse, { strokeDasharray: len, strokeDashoffset: len });

  // Posición del planeta sobre la elipse inclinada (ángulo en radianes).
  const rad = (tilt * Math.PI) / 180;
  const pw = planet.offsetWidth, ph = planet.offsetHeight;
  function placePlanet(t) {
    const a = t - Math.PI / 2; // arranca arriba
    const x = rx * Math.cos(a), y = ry * Math.sin(a);
    gsap.set(planet, {
      x: cx + x * Math.cos(rad) - y * Math.sin(rad) - pw / 2,
      y: cy + x * Math.sin(rad) + y * Math.cos(rad) - ph / 2,
    });
  }

  // Estado inicial: palabras tenues y desenfocadas.
  gsap.set(words, { opacity: 0.14, filter: "blur(3px)" });
  gsap.set(planet, { opacity: 0, scale: 0.6 });
  placePlanet(0);

  const tl = gsap.timeline({ paused: true });

  // Las palabras se encienden de a una entre 0.06 y 0.78.
  const step = 0.72 / words.length;
  words.forEach((w, i) => {
    tl.to(w, { opacity: 1, filter: "blur(0px)", duration: step * 3, ease: "power1.out" }, 0.06 + i * step);
  });
  // Las frases destacadas pasan a cyan y se subrayan cuando se encienden.
  for (const em of ems) {
    const ws = [...em.querySelectorAll(".w")];
    const at = 0.06 + words.indexOf(ws[ws.length - 1]) * step + step;
    tl.to(em, { color: "#3fd4f0", duration: 0.06, ease: "power1.out" }, at);
    tl.to(em, { backgroundSize: "100% 0.06em", duration: 0.08, ease: "power2.out" }, at + 0.02);
  }

  // Órbita y planeta acompañan la lectura; quedan quietos en el tramo final.
  tl.to(ellipse, { strokeDashoffset: 0, duration: 0.8, ease: "none" }, 0.02);
  tl.to(planet, { opacity: 1, scale: 1, duration: 0.08, ease: "power2.out" }, 0.02);
  const orbit = { t: 0 };
  tl.to(orbit, {
    t: Math.PI * 2, duration: 0.8, ease: "power1.inOut",
    onUpdate: () => placePlanet(orbit.t),
  }, 0.02);

  // Estrellas: parallax lento durante todo el recorrido.
  for (const s of stars) {
    tl.to(s, { y: -4 * u * s.dataset.depth, x: -1.5 * u * s.dataset.depth, duration: 1, ease: "none" }, 0);
  }

  if (tl.duration() < 1) tl.to({}, { duration: 1 - tl.duration() }, tl.duration());

  tl.progress(0);
  window.__tl = tl;
</script>
</body>
</html>
